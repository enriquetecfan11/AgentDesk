# Levanta Postgres 16 en el contenedor "db" y la app en "app".
#
#   cp .env.example .env      # y edita APP_BASE_URL y POSTGRES_PASSWORD
#   docker compose up -d
#
# El MISMO fichero sirve en el Mac mini (arm64) y en Proxmox (amd64):
# las imágenes se construyen en local con `docker compose build`, así que no
# hacen falta registries ni builds multiplataforma.
name: agentdesk

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Nota: dentro del contenedor "db" sí es correcto hablar por socket/127.0.0.1;
      # la regla de "nunca localhost" aplica a la configuración de la app.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
    image: agentdesk:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Host = nombre de servicio "db". Nunca localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_BASE_URL: ${APP_BASE_URL}
      UPLOADS_DIR: /app/uploads
    ports:
      - '${HOST_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000'
    volumes:
      - uploads:/app/uploads
    healthcheck:
      # No instalamos curl/wget en la imagen final; Node ya sabe hacer fetch.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  uploads:
